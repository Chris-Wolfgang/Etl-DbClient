# Semgrep — SAST layer complementary to CodeQL.
#
# CodeQL (`codeql.yaml`) is our OSS-grade baseline. Semgrep adds a second
# scanner with different rule packs (community C# taint, security-audit,
# secrets, owasp-top-ten) — the goal is OVERLAPPING signal, not replacing
# CodeQL. When both agree a finding is real, confidence is higher; when
# only one flags it, it's usually a false positive worth documenting.
#
# Semgrep is free for public repos with no account required. Enterprise
# SAST (Snyk, Veracode, Fortify, SonarQube Cloud, Checkmarx) is a project-
# level budget decision — see #131 for that discussion; this workflow is
# the free-tier baseline.
#
# Refs #131.

name: Semgrep SAST

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/semgrep.yaml'
      - '.semgrepignore'
  push:
    branches: [main, vNext]
    paths:
      - 'src/**'
      - '.github/workflows/semgrep.yaml'
      - '.semgrepignore'
  schedule:
    # Weekly Wed 05:37 UTC — catches new rule releases against unchanged code.
    - cron: '37 5 * * 3'
  workflow_dispatch:

# Least-privilege default at the top level; the `semgrep` job below
# elevates `security-events: write` locally for its SARIF upload.
# Satisfies Scorecard's TokenPermissionsID rule which flags top-level
# `security-events: write`.
concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to Code Scanning
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install semgrep (from PyPI, no account required)
        run: |
          # Hash-pinned (OSSF Scorecard pinned-dependencies); Dependabot bumps .github/requirements/semgrep.txt
          python -m pip install --user --require-hashes -r .github/requirements/semgrep.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Semgrep
        # --error makes findings exit 1; they are reported through the SARIF upload, so
        # 0 and 1 both continue. Anything else (bad config, crash, network) fails the job
        # instead of silently uploading nothing.
        run: |
          set +e
          semgrep scan \
            --config p/csharp \
            --config p/security-audit \
            --config p/secrets \
            --sarif --output semgrep.sarif \
            --error \
            src/
          rc=$?
          set -e
          case "$rc" in
            0) echo "semgrep: no findings" ;;
            1) echo "semgrep: findings reported (see the Security tab after upload)" ;;
            *) echo "::error::semgrep failed with exit code $rc (not a findings result)"; exit "$rc" ;;
          esac

      - name: Upload Semgrep SARIF
        # A fork's pull_request token cannot write Code Scanning (security-events: write is
        # not granted), so the upload would fail after a successful scan. Skip it there; the
        # scan step above still runs (report-only, as documented) and its SARIF is available
        # once the change lands in this repository.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep
